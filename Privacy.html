<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sebhusky Helper | Центр навигации</title>
    <style>
        :root {
            --bg-color: #181512;
            --surface-color: #24201c;
            --surface-hover: #2c2722;
            --text-main: #e6dfd5;
            --text-muted: #a39c93;
            --accent-color: #d97706; 
            --accent-glow: rgba(217, 119, 6, 0.2);
            --border-radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem;
        }

        .container {
            max-width: 900px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .logo {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: inline-block;
        }

        h1 {
            color: var(--text-main);
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Сетка для карточек (автоматически расширяется) */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* Стилизация ссылок-карточек */
        .nav-card {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .nav-card:hover {
            background-color: var(--surface-hover);
            transform: translateY(-4px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px var(--accent-glow);
        }

        .card-icon {
            font-size: 2rem;
            background: rgba(255, 255, 255, 0.05);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: transform 0.3s ease;
        }

        .nav-card:hover .card-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .card-title {
            color: var(--accent-color);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            flex-grow: 1;
        }

        .card-arrow {
            color: var(--text-muted);
            align-self: flex-end;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .nav-card:hover .card-arrow {
            color: var(--accent-color);
            transform: translateX(5px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            margin-top: auto;
            padding-top: 4rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">🐾</div>
            <h1>Sebhusky Helper</h1>
            <p class="subtitle">Главный центр навигации бота</p>
        </header>

        <!-- Сетка хаба. Благодаря CSS Grid (auto-fill), карточки будут автоматически 
             выстраиваться в ряды в зависимости от ширины экрана. -->
        <div class="nav-grid">
            
            <!-- Карточка 1: Политика конфиденциальности -->
            <a href="pages/Sebhusky_Helper_Privacy.html" class="nav-card">
                <div class="card-icon">📜</div>
                <div class="card-title">Политика конфиденциальности</div>
                <div class="card-desc">Правила обработки данных, отказ от ответственности и медвежьи клятвы.</div>
                <div class="card-arrow">➔</div>
            </a>

            <!-- ШАБЛОН ДЛЯ ДОБАВЛЕНИЯ НОВЫХ КАРТОЧЕК В БУДУЩЕМ -->
            <!-- 
            <a href="ВАША_ССЫЛКА.html" class="nav-card">
                <div class="card-icon">⚙️</div>
                <div class="card-title">Настройки / Команды</div>
                <div class="card-desc">Описание функционала, доступных команд и возможностей бота.</div>
                <div class="card-arrow">➔</div>
            </a>
            -->

            <!-- 
            <a href="https://t.me/your_bot" class="nav-card">
                <div class="card-icon">🤖</div>
                <div class="card-title">Перейти к боту</div>
                <div class="card-desc">Запустить бота в Telegram.</div>
                <div class="card-arrow">➔</div>
            </a>
            -->

        </div>
    </div>

    <footer>
        <p>© 2026 Sebhusky Helper. Все системы работают в штатном режиме.</p>
    </footer>

</body>
</html>
